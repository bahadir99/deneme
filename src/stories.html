<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stories</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1 style="font-size: 1.3em">Stories</h1>
      <div id="stories-list-container">
        <ul id="stories-list" style="list-style: none; padding: 0"></ul>
      </div>
      <div
        style="
          margin-top: 1em;
          display: flex;
          gap: 0.5em;
          justify-content: center;
          flex-wrap: wrap;
        "
      >
        <button id="create-new-story-btn" type="button">
          Create New Story
        </button>
        <button id="import-story-btn" type="button">Import Story</button>
        <button id="back-to-menu-btn" type="button">Back to Menu</button>
      </div>
    </main>
  </body>
</html>
