<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Story</title>
    <script type="module" src="/main.js" defer></script>
    <style>
      :root {
        --color-bg: #f8f9fa;
        --color-bg-alt: #fff;
        --color-border: #ddd;
        --color-primary: #396cd8;
        --color-primary-dark: #2c5aa0;
        --color-accent: #e67e22;
        --color-success: #28a745;
        --color-success-dark: #218838;
        --color-danger: #dc3545;
        --color-danger-dark: #c82333;
        --color-secondary: #6c757d;
        --color-secondary-dark: #5a6268;
        --color-text: #222;
        --color-text-light: #fff;
        --color-muted: #555;
        --color-muted-light: #666;
        --color-choice-bg: #f8f9fa;
        --color-choice-border: #e9ecef;
        --color-empty: #666;
      }

      html,
      body {
        font-size: 14px;
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--color-bg);
        color: var(--color-text);
      }

      .story-editor {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 300px;
        background: var(--color-bg);
        border-right: 1px solid var(--color-border);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        padding: 1em;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-bg-alt);
      }

      .story-title-input {
        font-size: 1.2em;
        font-weight: bold;
        border: none;
        border-bottom: 2px solid var(--color-primary);
        background: transparent;
        color: var(--color-text);
        width: 100%;
        padding: 0.3em 0;
      }

      .story-title-input:focus {
        outline: none;
        border-bottom-color: var(--color-accent);
      }

      .scenes-explorer {
        flex: 1;
        overflow-y: auto;
        padding: 1em;
        background: var(--color-bg);
      }

      .scenes-title {
        font-weight: bold;
        color: var(--color-muted);
        margin-bottom: 1em;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* New styles for tree view */
      .scenes-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .scenes-list ul {
        list-style: none;
        padding-left: 1em; /* Indentation for children */
        margin: 0;
      }

      .scene-item {
        padding: 0.5em;
        margin-bottom: 0.2em;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5em;
        transition: background-color 0.2s;
      }

      .scene-item:hover {
        background: #e9ecef;
        background: color-mix(in srgb, var(--color-primary) 10%, var(--color-bg) 90%);
      }

      .scene-item.active {
        background: var(--color-primary);
        color: var(--color-text-light);
      }

      .scene-toggle {
        width: 16px;
        height: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .scene-toggle::before {
        content: "►"; /* Right-pointing triangle for collapsed */
        font-size: 0.8em;
        transition: transform 0.2s;
      }

      .scene-item.expanded .scene-toggle::before {
        content: "▼"; /* Down-pointing triangle for expanded */
      }

      .scene-icon {
        width: 16px;
        height: 16px;
        background: var(--color-secondary);
        border-radius: 2px;
        flex-shrink: 0;
      }

      .scene-item.active .scene-icon {
        background: var(--color-text-light);
      }

      .scene-title {
        flex: 1;
        font-size: 0.9em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: inherit;
      }

      .scene-number {
        font-size: 0.8em;
        color: var(--color-secondary);
        font-weight: bold;
      }

      .scene-item.active .scene-number {
        color: rgba(255, 255, 255, 0.8);
      }

      .sidebar-actions {
        padding: 1em;
        border-top: 1px solid var(--color-border);
        background: var(--color-bg-alt);
      }

      .add-scene-btn {
        width: 100%;
        background: var(--color-success);
        color: var(--color-text-light);
        border: none;
        padding: 0.5em;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
      }

      .add-scene-btn:hover {
        background: var(--color-success-dark);
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--color-bg-alt);
      }

      .editor-header {
        padding: 1em;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .editor-title {
        font-weight: bold;
        color: var(--color-text);
      }

      .editor-actions {
        display: flex;
        gap: 0.5em;
      }

      .editor-content {
        flex: 1;
        padding: 2em;
        overflow-y: auto;
      }

      .empty-editor {
        text-align: center;
        color: var(--color-empty);
        padding: 4em 2em;
      }

      .empty-editor h3 {
        margin-bottom: 1em;
        color: var(--color-text);
      }

      .scene-form {
        max-width: 600px;
        margin: 0 auto;
      }

      .form-group {
        margin-bottom: 1.5em;
      }

      .form-label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.5em;
        color: var(--color-text);
      }

      .form-input {
        width: 100%;
        padding: 0.5em;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        font-family: inherit;
        font-size: 1em;
        background: var(--color-bg);
        color: var(--color-text);
      }

      .form-textarea {
        width: 100%;
        min-height: 120px;
        padding: 0.5em;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        font-family: inherit;
        font-size: 1em;
        resize: vertical;
        background: var(--color-bg);
        color: var(--color-text);
      }

      .choices-section {
        margin-top: 2em;
        padding-top: 1em;
        border-top: 1px solid #eee;
      }

      .choices-title {
        font-weight: bold;
        margin-bottom: 1em;
        color: var(--color-text);
      }

      .choice-item {
        display: flex;
        align-items: center;
        gap: 0.5em;
        margin-bottom: 0.8em;
        padding: 0.8em;
        background: var(--color-choice-bg);
        border-radius: 4px;
        border: 1px solid var(--color-choice-border);
      }

      .choice-text {
        flex: 1;
        padding: 0.4em;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        font-size: 0.9em;
        background: var(--color-bg);
        color: var(--color-text);
      }

      .choice-target {
        width: 150px;
        padding: 0.4em;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        font-size: 0.9em;
        background: var(--color-bg);
        color: var(--color-text);
      }

      .btn-small {
        padding: 0.3em 0.6em;
        font-size: 0.8em;
        border-radius: 4px;
        border: 1px solid var(--color-border);
        background: var(--color-bg-alt);
        color: var(--color-text);
        cursor: pointer;
      }

      .btn-small:hover {
        background: #f0f0f0;
        background: color-mix(in srgb, var(--color-primary) 10%, var(--color-bg-alt) 90%);
      }

      .btn-danger {
        background: var(--color-danger);
        color: var(--color-text-light);
        border-color: var(--color-danger);
      }

      .btn-danger:hover {
        background: var(--color-danger-dark);
      }

      .add-choice-btn {
        background: var(--color-success);
        color: var(--color-text-light);
        border: 1px solid var(--color-success);
        padding: 0.5em 1em;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        margin-top: 0.5em;
      }

      .add-choice-btn:hover {
        background: var(--color-success-dark);
      }

      .global-actions {
        padding: 1em;
        border-top: 1px solid var(--color-border);
        background: var(--color-bg);
        display: flex;
        gap: 0.5em;
        justify-content: center;
      }

      .btn-primary {
        background: var(--color-primary);
        color: var(--color-text-light);
        border: 1px solid var(--color-primary);
        padding: 0.6em 1.2em;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
      }

      .btn-primary:hover {
        background: var(--color-primary-dark);
      }

      .btn-secondary {
        background: var(--color-secondary);
        color: var(--color-text-light);
        border: 1px solid var(--color-secondary);
        padding: 0.6em 1.2em;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
      }

      .btn-secondary:hover {
        background: var(--color-secondary-dark);
      }

      /* DARK MODE (manual override) */
      .dark-mode {
        --color-bg: #181a1b;
        --color-bg-alt: #23272a;
        --color-border: #333a40;
        --color-primary: #6ea8fe;
        --color-primary-dark: #396cd8;
        --color-accent: #f7b84b;
        --color-success: #4fd18b;
        --color-success-dark: #218838;
        --color-danger: #e57373;
        --color-danger-dark: #c82333;
        --color-secondary: #adb5bd;
        --color-secondary-dark: #6c757d;
        --color-text: #f1f3f4;
        --color-text-light: #23272a;
        --color-muted: #b0b8c1;
        --color-muted-light: #888;
        --color-choice-bg: #23272a;
        --color-choice-border: #333a40;
        --color-empty: #b0b8c1;
      }
      .dark-mode html, .dark-mode body {
        background: var(--color-bg);
        color: var(--color-text);
      }

      /* Light mode (manual override) */
      .light-mode {
        --color-bg: #f8f9fa;
        --color-bg-alt: #fff;
        --color-border: #ddd;
        --color-primary: #396cd8;
        --color-primary-dark: #2c5aa0;
        --color-accent: #e67e22;
        --color-success: #28a745;
        --color-success-dark: #218838;
        --color-danger: #dc3545;
        --color-danger-dark: #c82333;
        --color-secondary: #6c757d;
        --color-secondary-dark: #5a6268;
        --color-text: #222;
        --color-text-light: #fff;
        --color-muted: #555;
        --color-muted-light: #666;
        --color-choice-bg: #f8f9fa;
        --color-choice-border: #e9ecef;
        --color-empty: #666;
      }
      .light-mode html, .light-mode body {
        background: var(--color-bg);
        color: var(--color-text);
      }

      /* Fallback: use system preference if not set manually */
      @media (prefers-color-scheme: dark) {
        :root:not(.light-mode):not(.dark-mode) {
          --color-bg: #181a1b;
          --color-bg-alt: #23272a;
          --color-border: #333a40;
          --color-primary: #6ea8fe;
          --color-primary-dark: #396cd8;
          --color-accent: #f7b84b;
          --color-success: #4fd18b;
          --color-success-dark: #218838;
          --color-danger: #e57373;
          --color-danger-dark: #c82333;
          --color-secondary: #adb5bd;
          --color-secondary-dark: #6c757d;
          --color-text: #f1f3f4;
          --color-text-light: #23272a;
          --color-muted: #b0b8c1;
          --color-muted-light: #888;
          --color-choice-bg: #23272a;
          --color-choice-border: #333a40;
          --color-empty: #b0b8c1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Theme selector is now global, remove from here -->
    <div class="story-editor">
      <!-- Left Sidebar - Scene Explorer -->
      <div class="sidebar">
        <div class="sidebar-header">
          <input
            type="text"
            id="story-title-input"
            class="story-title-input"
            placeholder="Story Title..."
          />
        </div>

        <div class="scenes-explorer">
          <div class="scenes-title">Scenes</div>
          <ul id="scenes-list" class="scenes-list">
            <div class="empty-editor">
              <p>No scenes yet. Click "Add Scene" to start!</p>
            </div>
          </ul>
        </div>

        <div class="sidebar-actions">
          <button id="add-scene-btn" class="add-scene-btn">+ Add Scene</button>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="main-content">
        <div class="editor-header">
          <div class="editor-title" id="editor-title">
            Select a scene to edit
          </div>
          <div class="editor-actions">
            <button
              id="delete-scene-btn"
              class="btn-small btn-danger"
              style="display: none"
            >
              Delete Scene
            </button>
          </div>
        </div>

        <div class="editor-content" id="editor-content">
          <div class="empty-editor">
            <h3>Welcome to Story Creator</h3>
            <p>
              Select a scene from the sidebar to start editing, or create a new
              scene to begin your story.
            </p>
          </div>
        </div>

        <div class="global-actions">
          <button id="save-story-btn" class="btn-primary">Save Story</button>
          <button id="cancel-story-btn" class="btn-secondary">
            Back to Menu
          </button>
        </div>
      </div>
    </div>
    <!-- Theme logic is now global, removed from here -->
  </body>
</html>
