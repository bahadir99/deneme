<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Story</title>
    <script type="module" src="/main.js" defer></script>
    <!-- Styles moved to styles.css -->
  </head>
  <body>
    <div class="story-editor">
      <!-- Left Sidebar - Scene Explorer -->
      <div class="sidebar">
        <div class="sidebar-header">
          <input
            type="text"
            id="story-title-input"
            class="story-title-input"
            placeholder="Story Title..."
          />
        </div>

        <div class="scenes-explorer">
          <div class="scenes-title">Scenes</div>
          <ul id="scenes-list" class="scenes-list">
            <div class="empty-editor">
              <p>No scenes yet. Click "Add Scene" to start!</p>
            </div>
          </ul>
        </div>

        <div class="sidebar-actions">
          <button id="add-scene-btn" class="add-scene-btn">+ Add Scene</button>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="main-content">
        <div class="editor-header">
          <div class="editor-title" id="editor-title">
            Select a scene to edit
          </div>
          <div class="editor-actions">
            <button
              id="delete-scene-btn"
              class="btn-small btn-danger"
              style="display: none"
            >
              Delete Scene
            </button>
          </div>
        </div>

        <div class="editor-content" id="editor-content">
          <div class="empty-editor">
            <h3>Welcome to Story Creator</h3>
            <p>
              Select a scene from the sidebar to start editing, or create a new
              scene to begin your story.
            </p>
          </div>
        </div>

        <div class="global-actions">
          <button id="save-story-btn" class="btn-primary">Save Story</button>
          <button id="cancel-story-btn" class="btn-secondary">
            Back to Menu
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
